version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: consumer360-db
    environment:
      POSTGRES_DB: consumer360_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - consumer360-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Node.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: consumer360-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: consumer360_db
      DB_USER: postgres
      DB_PASSWORD: postgres123
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - consumer360-network
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm start

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: consumer360-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - consumer360-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start

  # Python Analytics Service
  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    container_name: consumer360-analytics
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: consumer360_db
      DB_USER: postgres
      DB_PASSWORD: postgres123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - consumer360-network
    volumes:
      - ./analytics:/app
    command: python -m flask run --host=0.0.0.0 --port=8000

  # pgAdmin (Database Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: consumer360-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@consumer360.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - consumer360-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # Redis (Optional - for caching)
  redis:
    image: redis:7-alpine
    container_name: consumer360-redis
    ports:
      - "6379:6379"
    networks:
      - consumer360-network
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

networks:
  consumer360-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
